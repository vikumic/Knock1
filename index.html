<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Purple Dream</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#3b0764,#6d28d9,#9333ea,#c084fc);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    font-family:Arial, sans-serif;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    filter:blur(40px);
    animation:float 8s ease-in-out infinite;
}

.glow:nth-child(1){
    top:10%;
    left:10%;
}

.glow:nth-child(2){
    bottom:10%;
    right:10%;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-25px);
    }
}

.stars span{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    opacity:0.7;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%,100%{
        opacity:0.2;
        transform:scale(1);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

.music-btn{
    position:relative;
    padding:18px 40px;
    border:none;
    border-radius:50px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:18px;
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

.music-btn:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.18);
}

.wave{
    position:absolute;
    bottom:-5px;
    left:0;
    width:100%;
    height:100px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    filter:blur(10px);
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow"></div>

<div class="stars">
    <span style="top:15%;left:20%;"></span>
    <span style="top:30%;left:70%;"></span>
    <span style="top:70%;left:40%;"></span>
    <span style="top:60%;left:80%;"></span>
    <span style="top:80%;left:15%;"></span>
</div>

<button class="music-btn" onclick="playMusic()">
    ✨ Play Music
</button>

<div class="wave"></div>

<audio id="song" loop>
    <source src="Yeh-Dil-Deewana-1.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
    const song = document.getElementById("song");

    if(song.paused){
        song.play();
        document.querySelector(".music-btn").innerHTML = "💜 Playing...";
    }else{
        song.pause();
        document.querySelector(".music-btn").innerHTML = "✨ Play Music";
    }
}
</script>

</body>
</html>
